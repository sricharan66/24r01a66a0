<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery Carousel</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
    body {
      width: 100%;
      height: 100%;
    }
    .carousel-inner img {
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div id="myCarousel" class="carousel slide" data-ride="carousel">
      
      <!-- Indicators -->
      <ol class="carousel-indicators">
        <li data-target="#myCarousel" data-slide-to="0" class="active item1"></li>
        <li data-target="#myCarousel" data-slide-to="1" class="item2"></li>
        <li data-target="#myCarousel" data-slide-to="2" class="item3"></li>
        <li data-target="#myCarousel" data-slide-to="3" class="item4"></li>
        <li data-target="#myCarousel" data-slide-to="4" class="item5"></li>
      </ol>

      <!-- Wrapper for slides -->
      <div class="carousel-inner" role="listbox">
        <div class="item active">
          <img src="C:\Users\student\Desktop\66a0\msd.jpg" alt="MS Dhoni" width="50%" height="20%">
        </div>
        <div class="item">
          <img src="C:\Users\student\Desktop\66a0\virat.jpg" alt="Virat Kohli" width="50%" height="20%">
        </div>
        <div class="item">
          <img src="C:\Users\student\Desktop\66a0\rohit.jpg" alt="Rohit Sharma" width="40%" height="10%">
        </div>
        <div class="item">
          <img src="C:\Users\student\Desktop\66a0\gill.jpg" alt="Shubman Gill" width="40%" height="10%">
        </div>
        <div class="item">
          <img src="C:\Users\student\Desktop\66a0\raina.jpg" alt="Suresh Raina" width="40%" height="10%">
        </div>
      </div>

      <!-- Controls -->
      <a class="left carousel-control" href="#myCarousel" role="button" data-slide="prev">
        <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
        <span class="sr-only">Prev</span>
      </a>
      <a class="right carousel-control" href="#myCarousel" role="button" data-slide="next">
        <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
  </div>

  <script>
    $(document).ready(function(){
      $("#myCarousel").carousel();

      $(".item1").click(function(){ $("#myCarousel").carousel(0); });
      $(".item2").click(function(){ $("#myCarousel").carousel(1); });
      $(".item3").click(function(){ $("#myCarousel").carousel(2); });
      $(".item4").click(function(){ $("#myCarousel").carousel(3); });
      $(".item5").click(function(){ $("#myCarousel").carousel(4); });

      $(".left").click(function(){ $("#myCarousel").carousel("prev"); });
      $(".right").click(function(){ $("#myCarousel").carousel("next"); });
    });
  </script>
</body>
</html>
